apiVersion: v1
kind: Secret
metadata:
  name: job-platform-db
type: Opaque
stringData:
  POSTGRES_DB: jobsdb
  POSTGRES_USER: jobs
  POSTGRES_PASSWORD: jobs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: job-platform-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: job-platform-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-platform-db
                  key: POSTGRES_PASSWORD
          args:
            - postgres
            - "-c"
            - shared_buffers=64MB
            - "-c"
            - max_connections=50
          resources:
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - sh
                - "-c"
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: job-platform
  template:
    metadata:
      labels:
        app: job-platform
    spec:
      containers:
        - name: app
          image: job-platform-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://db:5432/jobsdb
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: job-platform-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: job-platform-db
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: job-platform
spec:
  type: LoadBalancer
  selector:
    app: job-platform
  ports:
    - port: 8081
      targetPort: 8080
